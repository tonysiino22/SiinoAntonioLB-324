name: Anforderung (neue Funktionalität)
description: Eine neue Anforderung nach dem vorgegebenen Anforderungsschema erfassen
title: "[Anforderung]: "
body:
  - type: markdown
    attributes:
      value: |
        Pro Issue wird genau **eine** Anforderung erfasst. Das Etikett
        (Funktionale Anforderung / Qualitätsanforderung / Randanforderung)
        wird nach dem Erstellen **manuell** gesetzt.
  - type: input
    id: zielsystem
    attributes:
      label: Zielsystem
      description: Welches System oder welche Komponente ist gemeint?
      placeholder: Die Tagebuch-Applikation
    validations:
      required: true
  - type: dropdown
    id: prioritaet
    attributes:
      label: Priorität
      description: Rechtliche Verbindlichkeit der Anforderung
      options:
        - muss
        - soll
        - wird
    validations:
      required: true
  - type: dropdown
    id: systemaktivitaet
    attributes:
      label: Systemaktivität
      description: Wie tritt das System gegenüber dem Benutzer auf?
      options:
        - selbständig ausführen
        - dem Benutzer die Möglichkeit bieten
        - fähig sein
    validations:
      required: true
  - type: textarea
    id: funktionalitaet
    attributes:
      label: Funktionalität
      description: Was genau soll geschehen? Kurz, klar und prüfbar formuliert.
      placeholder: einen neuen Tagebucheintrag speichern
    validations:
      required: true
  - type: textarea
    id: ergaenzungen
    attributes:
      label: Allfällige Ergänzungen
      description: Objekt, Detail oder Präzisierung zur Funktionalität (optional)
      placeholder: inklusive Datum und Uhrzeit des Eintrags
    validations:
      required: false
  - type: textarea
    id: bedingungen
    attributes:
      label: Bedingungen
      description: Unter welchen Voraussetzungen gilt die Anforderung? (optional)
      placeholder: sofern der Benutzer angemeldet ist
    validations:
      required: false
